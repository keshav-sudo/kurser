# Nginx configuration for multi-deploy system with Azure Blob Storage
# This handles production domains and preview URLs

# Configuration for Azure Blob Storage mount point
# Mount Azure Blob container to: /mnt/azure-blob/deployments

# Main production domain - serves latest deployment
server {
    listen 80;
    server_name example.com www.example.com;
    
    # Project ID - replace with actual project ID
    set $project_id "PROJECT_ID_HERE";
    
    # Path to latest deployment (managed by API - updates pointer)
    set $deploy_path /mnt/azure-blob/deployments/projects/$project_id/deploys/latest;
    
    # Serve static files
    location / {
        alias $deploy_path/;
        try_files $uri $uri/ /index.html =404;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Don't cache HTML
        location ~* \.(html)$ {
            expires -1;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
    
    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_vary on;
}

# Preview deployments - dynamic subdomain routing
# Pattern: {deployId}.example.com or {deployId}-{projectName}.preview.example.com
server {
    listen 80;
    server_name ~^(?<deploy_id>[a-zA-Z0-9\-]+)\.example\.com$;
    
    # Project ID - needs to be looked up or embedded in subdomain
    set $project_id "PROJECT_ID_HERE";
    
    # Path to specific deployment
    set $deploy_path /mnt/azure-blob/deployments/projects/$project_id/deploys/$deploy_id;
    
    # Check if deployment exists
    if (!-d $deploy_path) {
        return 404;
    }
    
    # Serve preview deployment
    location / {
        alias $deploy_path/;
        try_files $uri $uri/ /index.html =404;
        
        # Add preview banner header
        add_header X-Preview-Deploy $deploy_id always;
        
        # No caching for previews
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# Alternative: Preview with project name in subdomain
# Pattern: {deployId}-{projectId}.preview.example.com
server {
    listen 80;
    server_name ~^(?<deploy_id>[a-zA-Z0-9\-]+)-(?<project_id>[a-zA-Z0-9]+)\.preview\.example\.com$;
    
    set $deploy_path /mnt/azure-blob/deployments/projects/$project_id/deploys/$deploy_id;
    
    if (!-d $deploy_path) {
        return 404;
    }
    
    location / {
        alias $deploy_path/;
        try_files $uri $uri/ /index.html =404;
        
        add_header X-Preview-Deploy $deploy_id always;
        add_header X-Project-Id $project_id always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}

# Health check endpoint for Nginx
server {
    listen 80 default_server;
    server_name _;
    
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    location / {
        return 404;
    }
}
